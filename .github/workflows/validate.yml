name: Validate

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**']
  pull_request:
    # no base-branch restriction — run on every PR regardless of target
  workflow_dispatch:

jobs:
  json:
    name: JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          files=(
            settings.json
            mcp-servers.json
            mcp-servers.optional.json
            .claude-plugin/plugin.json
            reference/agent-schema.json
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
            else
              echo "SKIP (missing): $f"
            fi
          done

      - name: Validate mcp-servers.json has v3 servers
        run: |
          python3 <<'EOF'
          import json, sys
          data = json.load(open("mcp-servers.json"))
          servers = data.get("servers", {})
          required = {"playwright", "context7", "jina-reader"}
          missing = required - servers.keys()
          if missing:
              print(f"::error::mcp-servers.json missing v3 defaults: {missing}")
              sys.exit(1)
          print(f"OK: v3 MCP defaults present ({len(servers)} total)")
          EOF

      - name: Validate settings.json v3 fields
        run: |
          python3 <<'EOF'
          import json, sys
          s = json.load(open("settings.json"))
          required_keys = {"tui", "disableSkillShellExecution", "enabledMcpjsonServers"}
          missing = [k for k in required_keys if k not in s]
          if missing:
              print(f"::error::settings.json missing v3 keys: {missing}")
              sys.exit(1)
          allow = s.get("permissions", {}).get("allow", [])
          removed = [p for p in allow if p.startswith("mcp__") and any(x in p for x in ["memory", "exa", "github", "fetch"])]
          if removed:
              print(f"::error::settings.json still allows removed v2.1 MCP: {removed}")
              sys.exit(1)
          print("OK: v3 settings.json compliant")
          EOF

  marketplace-schema:
    name: Plugin Manifest & Marketplace Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required manifest files exist
        run: |
          test -f .claude-plugin/plugin.json || { echo "::error::.claude-plugin/plugin.json missing"; exit 1; }
          test -f .claude-plugin/marketplace.json || { echo "::error::.claude-plugin/marketplace.json missing"; exit 1; }
          echo "OK: both manifest files present"

      - name: plugin.json required fields
        run: |
          for field in name version description author repository; do
            value=$(jq -er ".${field}" .claude-plugin/plugin.json 2>/dev/null) || {
              echo "::error::.claude-plugin/plugin.json missing required field: ${field}"
              exit 1
            }
            echo "OK plugin.json.${field}=${value:0:60}"
          done

      - name: marketplace.json required fields
        run: |
          for field in '"$schema"' name description owner plugins; do
            jq -er ".${field}" .claude-plugin/marketplace.json > /dev/null 2>&1 || {
              echo "::error::.claude-plugin/marketplace.json missing required field: ${field}"
              exit 1
            }
            echo "OK marketplace.json.${field}"
          done
          count=$(jq -r '.plugins | length' .claude-plugin/marketplace.json)
          [ "$count" -ge 1 ] || { echo "::error::marketplace.json.plugins is empty"; exit 1; }
          echo "OK: marketplace.json has ${count} plugin entry(ies)"

      - name: Version drift guard (plugin.json ↔ marketplace.json)
        run: |
          PJV=$(jq -r '.version' .claude-plugin/plugin.json)
          MJV=$(jq -r '.version' .claude-plugin/marketplace.json)
          MPV=$(jq -r '.plugins[] | select(.name=="claude-forge") | .version' .claude-plugin/marketplace.json)
          echo "plugin.json.version=${PJV}"
          echo "marketplace.json.version=${MJV}"
          echo "marketplace.plugins[claude-forge].version=${MPV}"
          if [ "$PJV" != "$MJV" ] || [ "$MJV" != "$MPV" ]; then
            echo "::error::Version drift detected — all three must match (expected: ${PJV})"
            exit 1
          fi
          echo "OK: all three versions match"

      - name: SemVer format guard
        run: |
          PJV=$(jq -r '.version' .claude-plugin/plugin.json)
          if ! echo "$PJV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "::error::plugin.json.version '${PJV}' is not valid SemVer (X.Y.Z)"
            exit 1
          fi
          echo "OK: ${PJV} is valid SemVer"

  frontmatter:
    name: Agent & Skill Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install jsonschema pyyaml

      - name: Validate agents/*.md frontmatter
        run: |
          python3 <<'EOF'
          import json, re, sys
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              print("::warning::pyyaml missing, skipping")
              sys.exit(0)

          schema_path = Path("reference/agent-schema.json")
          if not schema_path.exists():
              print("::warning::reference/agent-schema.json missing, skipping schema check")
              sys.exit(0)

          from jsonschema import validate, ValidationError
          schema = json.loads(schema_path.read_text())
          errors = 0
          for p in Path("agents").glob("*.md"):
              text = p.read_text()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.DOTALL)
              if not m:
                  print(f"::error file={p}::missing YAML frontmatter")
                  errors += 1
                  continue
              try:
                  data = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  print(f"::error file={p}::invalid YAML: {e}")
                  errors += 1
                  continue
              try:
                  validate(data, schema)
                  print(f"OK: {p}")
              except ValidationError as e:
                  print(f"::error file={p}::schema violation: {e.message}")
                  errors += 1
          if errors:
              sys.exit(1)
          EOF

      - name: Validate skills/*/SKILL.md description
        run: |
          python3 <<'EOF'
          import re, sys
          from pathlib import Path
          errors = 0
          for skill_dir in Path("skills").iterdir():
              if not skill_dir.is_dir():
                  continue
              md = skill_dir / "SKILL.md"
              if not md.exists():
                  print(f"::warning file={skill_dir}::missing SKILL.md")
                  continue
              text = md.read_text()
              fm = re.match(r'^---\n(.*?)\n---\n', text, re.DOTALL)
              if not fm:
                  print(f"::error file={md}::missing YAML frontmatter")
                  errors += 1
                  continue
              body = fm.group(1)
              if not re.search(r'^name:\s', body, re.MULTILINE):
                  print(f"::error file={md}::missing 'name' field")
                  errors += 1
              if not re.search(r'^description:\s', body, re.MULTILINE):
                  print(f"::error file={md}::missing 'description' field")
                  errors += 1
              else:
                  print(f"OK: {md}")
          if errors:
              sys.exit(1)
          EOF

      # commands/*.md had no frontmatter validation at all, which is why 10 of
      # 34 commands shipped with frontmatter that no YAML parser can read
      # (a bare `argument-hint: [a] [b]` is not valid YAML). See #55.
      - name: Validate commands/*.md frontmatter
        run: |
          python3 <<'EOF'
          import re, sys, yaml
          from pathlib import Path

          errors = 0
          checked = 0
          for md in sorted(Path("commands").glob("*.md")):
              text = md.read_text()
              fm = re.match(r'^---\n(.*?)\n---\n', text, re.DOTALL)
              if not fm:
                  # Not every command carries frontmatter; that is allowed.
                  print(f"::warning file={md}::no YAML frontmatter (skipped)")
                  continue
              checked += 1
              try:
                  data = yaml.safe_load(fm.group(1))
              except yaml.YAMLError as e:
                  detail = str(e).replace("\n", " ")[:200]
                  print(f"::error file={md}::frontmatter is not valid YAML: {detail}")
                  errors += 1
                  continue
              if not isinstance(data, dict):
                  print(f"::error file={md}::frontmatter is not a mapping")
                  errors += 1
                  continue
              # `argument-hint: [a] [b]` parses as a list (or fails outright).
              # Every loader documents it as a string; Copilot CLI >= 1.0.65
              # silently drops the command when it is not one.
              hint = data.get("argument-hint")
              if hint is not None and not isinstance(hint, str):
                  print(f"::error file={md}::argument-hint must be a string, got "
                        f"{type(hint).__name__} — wrap the value in quotes")
                  errors += 1
                  continue
              print(f"OK: {md}")

          print(f"checked {checked} command(s) with frontmatter")
          if errors:
              sys.exit(1)
          EOF

      - name: Validate argument-hint is a string in skills
        run: |
          python3 <<'EOF'
          import re, sys, yaml
          from pathlib import Path

          errors = 0
          for md in sorted(Path("skills").rglob("*.md")):
              fm = re.match(r'^---\n(.*?)\n---\n', md.read_text(), re.DOTALL)
              if not fm:
                  continue
              try:
                  data = yaml.safe_load(fm.group(1))
              except yaml.YAMLError as e:
                  detail = str(e).replace("\n", " ")[:200]
                  print(f"::error file={md}::frontmatter is not valid YAML: {detail}")
                  errors += 1
                  continue
              if not isinstance(data, dict):
                  continue
              hint = data.get("argument-hint")
              if hint is not None and not isinstance(hint, str):
                  print(f"::error file={md}::argument-hint must be a string, got "
                        f"{type(hint).__name__} — wrap the value in quotes")
                  errors += 1
          if errors:
              sys.exit(1)
          print("OK: every skill argument-hint is a string")
          EOF

      # The forge.review/v1 envelope is written out in more than one place: once
      # as the checker's output contract, then again in every worked example. Two
      # copies of a contract drift silently, and the drift only shows up when
      # someone tries to parse a verdict. This checks two things against the
      # contract in agents/adversarial-reviewer.md: that every envelope carries
      # the same keys, and that each concrete value an example uses is a member
      # of the enum the contract declares (so a fourth verdict word fails here
      # rather than in a live review). Every block in each file is checked, not
      # just the first one.
      - name: forge.review/v1 envelope parity (agent contract vs worked examples)
        run: |
          python3 <<'EOF'
          import json, re, sys, textwrap
          from pathlib import Path

          FENCE = re.compile(r'^[ \t]*```json[ \t]*\n(.*?)^[ \t]*```[ \t]*$',
                             re.DOTALL | re.MULTILINE)
          SOURCES = ["agents/adversarial-reviewer.md", "docs/VERIFICATION-LOOP.md"]
          # Fields the contract declares as a pipe-separated enum. An example's
          # concrete value has to be one of the alternatives.
          ENUM_TOP = ["verdict"]
          ENUM_FINDING = ["severity"]

          def envelopes(path):
              """Every forge.review/v1 block in the file, in document order."""
              found = []
              for m in FENCE.finditer(Path(path).read_text()):
                  body = textwrap.dedent(m.group(1))
                  if "forge.review/v1" not in body:
                      continue
                  try:
                      data = json.loads(body)
                  except json.JSONDecodeError as e:
                      print(f"::error file={path}::forge.review/v1 block is not parseable JSON: {e}")
                      sys.exit(1)
                  if not isinstance(data.get("findings"), list) or not data["findings"]:
                      print(f"::error file={path}::forge.review/v1 block has no findings[] item to compare")
                      sys.exit(1)
                  found.append(data)
              if not found:
                  print(f"::error file={path}::no forge.review/v1 JSON block found")
                  sys.exit(1)
              return found

          ref_path = SOURCES[0]
          ref = envelopes(ref_path)[0]
          ref_top, ref_find = set(ref), set(ref["findings"][0])

          def alternatives(template_value):
              return [v.strip() for v in str(template_value).split("|")]

          enums_top = {k: alternatives(ref[k]) for k in ENUM_TOP if k in ref}
          enums_find = {k: alternatives(ref["findings"][0][k])
                        for k in ENUM_FINDING if k in ref["findings"][0]}

          errors = 0
          checked = 0
          for path in SOURCES:
              for index, other in enumerate(envelopes(path)):
                  # The reference block defines the shape; it is not compared to itself.
                  is_reference = path == ref_path and index == 0
                  label = f"{path} block #{index + 1}"
                  checked += 1
                  if not is_reference:
                      top, find = set(other), set(other["findings"][0])
                      if top != ref_top:
                          print(f"::error file={path}::{label}: top-level keys drifted from "
                                f"{ref_path}: {sorted(top ^ ref_top)}")
                          errors += 1
                      if find != ref_find:
                          print(f"::error file={path}::{label}: findings[] keys drifted from "
                                f"{ref_path}: {sorted(find ^ ref_find)}")
                          errors += 1
                  for key, allowed in enums_top.items():
                      value = other.get(key)
                      if value in (None, ref.get(key)):
                          continue  # absent, or the template string itself
                      if value not in allowed:
                          print(f"::error file={path}::{label}: {key}={value!r} is not one of "
                                f"{allowed} (declared in {ref_path})")
                          errors += 1
                  for finding_index, finding in enumerate(other["findings"]):
                      for key, allowed in enums_find.items():
                          value = finding.get(key)
                          if value in (None, ref["findings"][0].get(key)):
                              continue
                          if value not in allowed:
                              print(f"::error file={path}::{label} findings[{finding_index}]: "
                                    f"{key}={value!r} is not one of {allowed} "
                                    f"(declared in {ref_path})")
                              errors += 1
          if errors:
              sys.exit(1)
          print(f"OK: {checked} forge.review/v1 block(s) across {len(SOURCES)} files agree with {ref_path}")
          print(f"    top-level: {sorted(ref_top)}")
          print(f"    findings[]: {sorted(ref_find)}")
          for key, allowed in {**enums_top, **enums_find}.items():
              print(f"    {key} enum: {allowed}")
          EOF

  installer:
    name: Installer Dry-Run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bash syntax
        run: bash -n install.sh

      # install.ps1 had no CI coverage at all, which is how #50 (statusLine
      # broken on Windows because cc-chips-custom/scripts were never copied)
      # survived a full release cycle. Both hosted runners ship pwsh.
      - name: PowerShell syntax (install.ps1)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "OK: install.ps1 parses cleanly"

      - name: Installer parity (install.ps1 must ship every install.sh directory)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # install.sh is the source of truth: read its directory loop.
          $shLine = @(Select-String -Path ./install.sh -Pattern '^\s*for dir in (.+); do\s*$')
          if ($shLine.Count -ne 1) {
            Write-Host "::error file=install.sh::expected exactly one 'for dir in ...; do' loop, found $($shLine.Count)"
            exit 1
          }
          $shDirs = $shLine[0].Matches[0].Groups[1].Value.Trim() -split '\s+' | Sort-Object -Unique

          # Pull $directories out of install.ps1 through the AST rather than grepping
          # the file. A plain grep passes as long as the word appears anywhere, so a
          # comment mentioning "scripts" would mask its removal from the array.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$null)
          $assign = @($ast.FindAll({
            param($n)
            $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and
            $n.Left.Extent.Text -eq '$directories'
          }, $true))
          # Require exactly one assignment, mirroring the install.sh loop check.
          # With two assignments in the same scope PowerShell uses the last one at
          # runtime, so checking the first would report green while the installer
          # actually skips a directory — the same silent-omission shape as #50.
          if ($assign.Count -ne 1) {
            Write-Host ('::error file=install.ps1::expected exactly one $directories assignment, found ' + $assign.Count)
            exit 1
          }
          $psDirs = $assign[0].Right.FindAll({
            param($n) $n -is [System.Management.Automation.Language.StringConstantExpressionAst]
          }, $true) | ForEach-Object { $_.Value } | Sort-Object -Unique

          Write-Host "install.sh  : $($shDirs -join ', ')"
          Write-Host "install.ps1 : $($psDirs -join ', ')"

          $missing = @($shDirs | Where-Object { $psDirs -notcontains $_ })
          if ($missing.Count -gt 0) {
            Write-Host "::error file=install.ps1::does not install $($missing -join ', ') but install.sh does (see #50)"
            exit 1
          }
          Write-Host "OK: install.ps1 covers all $($shDirs.Count) install.sh directories"

      - name: "No plugin hooks manifest (regression guard for #52 / #57)"
        run: |
          # Claude Code parses hooks/hooks.json as a plugin hooks manifest and
          # requires a top-level "hooks" wrapper. A non-conforming file there
          # makes the entire plugin fail to load. Hook wiring belongs in
          # settings.json — see hooks/README.md.
          if [ -e hooks/hooks.json ]; then
            if ! jq -e '.hooks | type == "object"' hooks/hooks.json > /dev/null 2>&1; then
              echo "::error file=hooks/hooks.json::present but missing top-level \"hooks\" object — this breaks plugin load (#52, #57). Put hook wiring in settings.json instead."
              exit 1
            fi
            echo "OK: hooks/hooks.json has a valid top-level hooks wrapper"
          else
            echo "OK: no hooks/hooks.json (wiring lives in settings.json)"
          fi
          jq -e '.hooks | type == "object"' settings.json > /dev/null \
            || { echo "::error file=settings.json::missing hooks object"; exit 1; }
          echo "OK: settings.json carries the hooks block"

      # Three hooks shipped as mode 100644 and died with exit 126 the moment
      # Claude Code executed them by path. `chmod +x` on a dev machine does not
      # ship — git records the mode, so the guard reads the recorded mode.
      - name: Wired hooks are executable
        run: |
          python3 <<'EOF'
          import json, subprocess, sys
          from pathlib import Path

          settings = json.loads(Path("settings.json").read_text())
          commands = sorted({
              hook["command"]
              for group in settings.get("hooks", {}).values()
              for entry in group
              for hook in entry.get("hooks", [])
              if hook.get("type") == "command" and "command" in hook
          })

          modes = {}
          for line in subprocess.run(
                  ["git", "ls-files", "-s"], capture_output=True, text=True,
                  check=True).stdout.splitlines():
              meta, path = line.split("\t", 1)
              modes[path] = meta.split()[0]

          errors = checked = 0
          for command in commands:
              # settings.json addresses hooks by their installed location;
              # ~/.claude/<x> is the repo's <x>.
              if not command.startswith("~/.claude/"):
                  continue
              path = command[len("~/.claude/"):]
              mode = modes.get(path)
              if mode is None:
                  print(f"::error file=settings.json::wired hook not tracked in this repo: {path}")
                  errors += 1
                  continue
              checked += 1
              if mode != "100755":
                  print(f"::error file={path}::wired in settings.json but git mode is {mode} — "
                        f"it will fail with exit 126 when executed. Run: "
                        f"git update-index --chmod=+x {path}")
                  errors += 1
              else:
                  print(f"OK: {path}")

          print(f"checked {checked} wired hook file(s)")
          if errors:
              sys.exit(1)
          EOF

      - name: Dry-run help
        run: ./install.sh --help || true

      - name: Dry-run upgrade smoke
        run: |
          ./install.sh --upgrade --dry-run 2>&1 | tee /tmp/upgrade.log
          # ANSI escape를 제거한 후 패턴 매칭 (install.sh가 컬러 출력)
          sed 's/\x1b\[[0-9;]*m//g' /tmp/upgrade.log > /tmp/upgrade.plain
          grep -q "v3.0 core MCP entries present (3/3" /tmp/upgrade.plain || { echo "::error::v3 MCP not detected"; cat /tmp/upgrade.plain | tail -30; exit 1; }

  security:
    name: Secret & Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # AWS/Anthropic 공식 문서 예시 키는 화이트리스트
          # AKIAIOSFODNN7EXAMPLE = AWS 공식 docs 예제 (real key 아님)
          PATTERNS='(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|AKIA[A-Z0-9]{16}|sb_publishable_[a-zA-Z0-9]+)'
          WHITELIST='AKIAIOSFODNN7EXAMPLE|sk-ant-example|sk-test-example|ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
          MATCHES=$(grep -rE "$PATTERNS" --include='*.json' --include='*.sh' --include='*.md' . 2>/dev/null \
                    | grep -vE "$WHITELIST" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Potential secrets found:"
            echo "$MATCHES"
            exit 1
          else
            echo "No secrets detected (whitelisted: AWS/Anthropic doc examples)."
          fi

      - name: Secret-guard regression suite
        run: bash scripts/tests/test_precommit_guard.sh

      # test_precommit_guard.sh was the only suite CI ran. The other three
      # existed and passed locally, which is how a hook that could not execute
      # at all reached a release branch.
      - name: Remaining regression suites
        run: |
          set -e
          for suite in \
              scripts/tests/test_hook_guard.sh \
              scripts/tests/test_auto_resume_classify.sh \
              scripts/tests/test_s5_hooks.sh; do
            echo "::group::${suite}"
            bash "$suite"
            echo "::endgroup::"
          done
          echo "::group::scripts/tests/test_emdash_check.py"
          python3 scripts/tests/test_emdash_check.py
          echo "::endgroup::"

      - name: Bats suites (skipped when bats is unavailable)
        run: |
          if ! command -v bats >/dev/null 2>&1; then
            echo "bats not installed — skipping (the skill and its hooks work standalone)"
            exit 0
          fi
          shopt -s nullglob
          files=(skills/*/tests/*.bats)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .bats suites found"
            exit 0
          fi
          bats "${files[@]}"

      - name: ShellCheck hooks
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: hooks
          severity: warning
        continue-on-error: true

      - name: ShellCheck installer
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=warning install.sh || true
          fi

  links:
    name: Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link checker (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Targets: LLM-facing entry points + distribution docs.
          # Excludes: clau.de (anti-bot), localhost, hub example URLs in skills.
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --timeout 20
            --max-retries 2
            --max-concurrency 4
            --exclude '^https?://clau\.de'
            --exclude 'github\.com/[^/]+/[^/]+/(stargazers|network|members|graphs)'
            --exclude '^https?://localhost'
            --exclude '^https?://(127\.|0\.0\.0\.0|192\.168\.|10\.)'
            INSTALL.md
            README.md
            README.ko.md
            'docs/*.md'
            'docs/adr/**/*.md'
            '.github/ISSUE_TEMPLATE/*.md'
            '.github/ISSUE_TEMPLATE/*.yml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  doc-version-sync:
    name: Doc Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect stale current-state version refs in user-facing docs
        run: |
          # Catches the failure mode discovered in the v3.0.2 ultrathink audit:
          # plugin.json/marketplace.json get bumped, but specific *current-state*
          # claims in user-facing docs drift behind. We intentionally do NOT
          # check historical narration ("v3.0.1 introduced X", "since v3.0.1") —
          # those are legitimate timeline references.
          #
          # Two precise patterns are checked:
          #   1. README*.md file-structure tree:  ├── *.json ... (X.Y.Z)
          #   2. MARKETPLACE-SUBMISSION.md table: | Current version | `X.Y.Z` |
          PJV=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "Expected current version: ${PJV}"
          STALE=0

          # Pattern 1: README* file-structure tree refs
          for f in README.md README.ko.md; do
            FOUND=$(grep -hE '^\s*├──.*\.json.*\([0-9]+\.[0-9]+\.[0-9]+\)' "$f" 2>/dev/null \
                    | grep -oE '\([0-9]+\.[0-9]+\.[0-9]+\)' \
                    | tr -d '()' \
                    | sort -u \
                    | grep -v "^${PJV}$" || true)
            if [ -n "$FOUND" ]; then
              echo "::error file=${f}::stale file-structure tree version(s): ${FOUND} (expected ${PJV})"
              STALE=$((STALE+1))
            fi
          done

          # Pattern 2: MARKETPLACE-SUBMISSION "| Current version | `X.Y.Z` |"
          FOUND=$(grep -hE '^\| Current version \|' docs/MARKETPLACE-SUBMISSION.md 2>/dev/null \
                  | grep -oE '`[0-9]+\.[0-9]+\.[0-9]+`' \
                  | tr -d '`' \
                  | sort -u \
                  | grep -v "^${PJV}$" || true)
          if [ -n "$FOUND" ]; then
            echo "::error file=docs/MARKETPLACE-SUBMISSION.md::stale 'Current version' row: ${FOUND} (expected ${PJV})"
            STALE=$((STALE+1))
          fi

          if [ "$STALE" -gt 0 ]; then
            echo "::error::${STALE} stale current-state version reference(s). Bump to ${PJV}."
            exit 1
          fi
          echo "OK: no stale current-state version references in user-facing docs."

      # The Korean pack shipped a checker its own rule file failed: the document
      # banning em-dash interjections used one inside the clause banning them.
      # A guard that its author's own text cannot pass teaches readers to ignore
      # it, so the Korean-facing docs are now held to it in CI.
      - name: Korean prose em-dash gate (the checker's own docs must pass it)
        run: |
          python3 scripts/emdash_slop_check.py \
            rules/korean-writing-quality.md \
            MIGRATION.ko.md \
            README.ko.md
          echo "OK: Korean-facing docs pass scripts/emdash_slop_check.py"
